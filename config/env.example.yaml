# Copy to env.yaml and fill in for your workspace.
catalog: magnolia_pharma
storage_account: your_storage_account
container: lakehouse
landing_base: abfss://lakehouse@your_storage_account.dfs.core.windows.net/landing
checkpoint_base: abfss://lakehouse@your_storage_account.dfs.core.windows.net/_checkpoints

schemas:
  bronze: bronze
  silver: silver
  gold: gold
  ml: ml

entra_groups:
  commercial_analysts: sg_magnolia_commercial
  market_access: sg_magnolia_market_access
  data_science: sg_magnolia_data_science
  platform_engineers: sg_magnolia_platform

streaming:
  trigger: "10 seconds"
  max_files_per_trigger: 200

patient_journey:
  liquid_cluster_by:
    - patient_token
    - event_date
