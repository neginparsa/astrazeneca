# Demo / Databricks Free Edition — no Azure ADLS, no DBFS.
# Catalog must be `main` on Free Edition.
mode: demo
catalog: main

landing_base: ""
checkpoint_base: ""

storage_account: ""
container: ""

schemas:
  bronze: bronze
  silver: silver
  gold: gold
  ml: ml

entra_groups:
  commercial_analysts: sg_magnolia_commercial
  market_access: sg_magnolia_market_access
  data_science: sg_magnolia_data_science
  platform_engineers: sg_magnolia_platform

streaming:
  trigger: "10 seconds"
  max_files_per_trigger: 200

patient_journey:
  liquid_cluster_by:
    - patient_token
    - event_date
